[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-lab"
version = "0.1.0"
description = "When can a vision model act alone? Experiments on public benchmarks, one chapter each."
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "chapters"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
